<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso recepción</title><style>body{font-family:Arial;background:#101827;display:grid;place-items:center;min-height:100vh;margin:0}.box{width:min(380px,calc(100% - 30px));background:#fff;padding:28px;border-radius:18px;box-sizing:border-box}input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 14px;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:13px;background:#101827;color:#fff;border:0;border-radius:10px;font-weight:bold}.flash{background:#fff4d6;padding:10px;border-radius:8px}</style></head><body><form class="box" method="post"><h2>{{motel.name}}</h2><p>Acceso de recepción</p>{% with ms=get_flashed_messages() %}{% for m in ms %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}<label>Usuario<input name="username" required></label><label>Contraseña<input type="password" name="password" required></label><button>Ingresar</button><small><p>Configurá ADMIN_USER y ADMIN_PASSWORD para cambiar las credenciales.</p></small></form></body></html>
