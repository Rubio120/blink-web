<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario</title><style>body{font-family:Arial;background:#f4f6f8;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:white;border-radius:15px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}.tag{background:#eef2ff;padding:6px;border-radius:8px}</style></head><body><main class="wrap"><p><a href="{{url_for('admin')}}">← Panel</a></p><h1>Agenda del día</h1><form><input type="date" name="day" value="{{day}}"><button>Ver fecha</button></form><div class="card"><table><tr><th>Habitación</th><th>Cliente</th><th>Entrada</th><th>Salida</th><th>Estado</th></tr>{% for r in reservations %}<tr><td>Hab. {{'%02d'|format(r.room_id)}}</td><td>{{r.customer_name}}</td><td>{{r.start_at.replace('T',' ')}}</td><td>{{r.end_at.replace('T',' ')}}</td><td><span class="tag">{{r.status}}</span></td></tr>{% else %}<tr><td colspan="5">Sin reservas para esta fecha.</td></tr>{% endfor %}</table></div></main></body></html>
